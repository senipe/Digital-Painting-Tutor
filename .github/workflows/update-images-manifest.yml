name: Update image manifest

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate images-manifest.json
        run: node scripts/generate-manifest.js

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images-manifest.json images-manifest.js
          if git diff --staged --quiet; then
            echo "Manifest unchanged."
          else
            git commit -m "Update images-manifest.json"
            git push
          fi
